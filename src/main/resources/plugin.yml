name: VerticalAntiESP
version: '1.0.0'
main: com.sektor.verticalantiesp.VerticalAntiESP
api-version: '1.20'
author: Ayberk & DeepMind
description: Ultra-high-performance zero-leak vertical entity culler & anti-ESP.
depend:
  - packetevents

permissions:
  verticalantiesp.bypass:
    description: Allows player to bypass entity hiding (see all entities).
    default: op
  verticalantiesp.admin:
    description: Allows player to reload the plugin.
    default: op

commands:
  verticalantiesp:
    description: Main command for VerticalAntiESP
    aliases: [vaesp]
    permission: verticalantiesp.admin
    usage: /<command> [reload]
