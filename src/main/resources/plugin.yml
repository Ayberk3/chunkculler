name: SubChunkCuller
version: '1.3.0'
main: dev.ayberk.subchunkculler.Main
api-version: '1.20'
author: Ayberk & DeepMind
description: High-performance subchunk occlusion culling and zero-leak vertical anti-ESP.
depend:
  - packetevents

permissions:
  subchunkculler.admin:
    description: Allows player to reload the plugin.
    default: op
  subchunkculler.bypass:
    description: Allows player to bypass entity and subchunk culling.
    default: false

commands:
  subchunkculler:
    description: SubChunkCuller main command
    aliases: [scc, chunkculler]
    permission: subchunkculler.admin
    usage: /<command> [reload]
