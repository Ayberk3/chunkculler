# ==========================================================
#                   SubChunkCuller Config
#   SubChunk Occlusion Culler & Zero-Leak Vertical Anti-ESP
# ==========================================================

# 1. SubChunk (Block & Section) Culling Settings
sub-chunks-below: 2
absolute-cutoff-y: 0
enabled-worlds:
  - world
  - world_nether
  - world_the_end

refresh-radius: 3
refresh-cooldown-ms: 250
refresh-debounce-ticks: 6
refresh-chunks-per-tick: 6

fake-floor:
  enabled: true
  block: "minecraft:deepslate"

block-update-filter:
  enabled: true

# 2. Zero-Leak Vertical Entity Anti-ESP Settings
entity-culler:
  enabled: true
  # Hide entities >= 48 blocks below the viewer
  hide-distance-y: 48.0
  # Reveal entities only when viewer gets within <= 42 blocks (Hysteresis buffer)
  show-distance-y: 42.0
  # Scan interval in ticks (4 ticks = 0.2s)
  check-interval-ticks: 4

  targets:
    hide-players: true
    hide-monsters: true
    hide-animals: false
    hide-misc: true

  # Dampen deep underground sound packets (Sound ESP prevention)
  dampen-underground-sounds: true

# Console debugging
debug-mode: false
