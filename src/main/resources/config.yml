# ==========================================================
#              VerticalAntiESP Configuration
# Ultra-High-Performance Zero-Leak Vertical Entity Culler
# ==========================================================

# Vertical Distance Settings (in blocks)
# If an entity is >= hide-distance-y blocks BELOW the viewer, it is culled.
hide-distance-y: 48.0

# Hysteresis Buffer:
# The entity will only be revealed again once the viewer comes within <= show-distance-y.
# (This prevents packet thrashing / flicker when jumping or standing on threshold).
show-distance-y: 42.0

# Scan interval in server ticks (20 ticks = 1 second, 4 ticks = 0.2s)
check-interval-ticks: 4

# Entity Types to Hide
targets:
  # Hide players who are 48 blocks below (Protects against Player ESP / Tracers)
  hide-players: true

  # Hide monsters (Zombies, Skeletons, Creepers, etc.)
  hide-monsters: true

  # Hide passive animals (Cows, Sheep, Horses, etc.)
  hide-animals: false

  # Hide other entities (Minecarts with chest, armor stands, etc.)
  hide-misc: true

# Sound Leaks Protection
# Prevents hack clients from locating underground players via localized sound packets
dampen-underground-sounds: true

# Debug mode for server console logging
debug: false
