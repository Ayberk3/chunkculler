# ==========================================================
#                   SubChunkCuller Config
#   SubChunk Occlusion Culler & Zero-Leak Vertical Anti-ESP
# ==========================================================

# 1. SubChunk (Block & Section) Culling Settings
sub-chunks-below: 2
absolute-cutoff-y: 0
enabled-worlds:
  - world
  - world_nether
  - world_the_end

refresh-radius: 3
refresh-cooldown-ms: 250
refresh-debounce-ticks: 6
refresh-chunks-per-tick: 6

fake-floor:
  enabled: false
  block: "minecraft:deepslate"

block-update-filter:
  enabled: true

# 2. Zero-Leak Vertical Entity Anti-ESP Settings
entity-culler:
  enabled: true
  # Scan interval in ticks (2 ticks = 0.1s for ultra-fast response)
  check-interval-ticks: 2

  # Dampen deep underground sound packets (Sound ESP prevention)
  dampen-underground-sounds: true

# Console debugging
debug-mode: false
