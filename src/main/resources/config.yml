# How many 16-block sub-chunk sections below the player's current section
# stay visible to their client. Anything further below is stripped from
# the outgoing chunk packet entirely - never sent, not just hidden
# client-side.
sub-chunks-below: 2

# Worlds this system is active in. Add every world you want protected
# (world names, not UUIDs).
enabled-worlds:
  - world

# Hard floor for the cutoff, in blocks. Whichever is HIGHER (more
# restrictive) of "N sections below the player" or this value wins - so a
# player flying/standing high up never has ordinary surface terrain hidden
# just because they're technically more than N sections above bedrock.
# As the player approaches/goes below this Y, terrain below them starts
# unhiding normally based on sub-chunks-below.
absolute-cutoff-y: 0

# Logs interception/culling metrics to console. Leave off in production -
# this runs on the packet thread for every chunk packet sent.
debug-mode: false

# Radius, in chunks, around a player to force a chunk resend when they
# cross a sub-chunk section boundary, so newly-dug-into sections load in.
refresh-radius: 3

# Minimum milliseconds between forced chunk refreshes for the same player,
# to avoid flooding the network thread while a player digs straight down.
refresh-cooldown-ms: 250
