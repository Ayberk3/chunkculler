# ==========================================================
#                   SubChunkCuller Config
#   SubChunk Occlusion Culler & Zero-Leak Vertical Anti-ESP
# ==========================================================

# 1. SubChunk (Block & Section) Culling Settings
# Number of 16-block subchunks below the player to keep visible.
# Example: If set to 2, 2 sections below the player are kept intact.
sub-chunks-below: 2

# Absolute cutoff block Y level. Sections BELOW this Y level may be culled.
# When player is on the surface (e.g. Y=80), culling starts at this boundary.
# When player goes underground below this Y level, relative sub-chunks-below takes over.
# Set to a very low value (e.g. -64) to disable absolute cutoff and only use relative.
absolute-cutoff-y: 0

# Worlds where SubChunkCuller is enabled
enabled-worlds:
  - world
  - world_nether
  - world_the_end

# Chunk refresh settings (automatically adapts to player view-distance)
refresh-radius: 8
refresh-cooldown-ms: 250
refresh-debounce-ticks: 4
refresh-chunks-per-tick: 12

# Fake floor (generates a natural deepslate floor at cutoff boundary)
fake-floor:
  enabled: true
  block: "minecraft:deepslate"

# Filter block updates below cutoff (prevents ghost block flickers)
block-update-filter:
  enabled: true

# 2. Zero-Leak Vertical Entity Anti-ESP Settings
entity-culler:
  enabled: true
  # Scan interval in ticks (2 ticks = 0.1s, 4 ticks = 0.2s)
  check-interval-ticks: 4

  # Entity type filters (true = hide this type when below cutoff)
  targets:
    hide-players: true
    hide-monsters: true
    hide-animals: false
    hide-misc: true
    bypass-npcs: true
    bypass-holograms: true

# Console debugging
debug-mode: false
