name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "SubChunkCuller v1.3.0 (Master Release - Final Polish & Rock Solid)"
          body: |
            ## 🚀 SubChunkCuller v1.3.0 (Master Production Release)

            ### 👑 Tam Kusursuz Mimari & Performans:
            - **Kusursuz Matematik & Görüş Mesafesi:** `computeCutoffSection` matematiksel formülü `Math.min(dynamicCutoff, absoluteCutoffSection)` ile yüzeyde Y=0 altını, yeraltında ise oyuncunun bulunduğu derin mağarayı %100 açık tutar.
            - **Paper Mekansal Arama:** `world.getNearbyEntities()` doğrudan Paper'ın yerel 3D chunk dilim filtresiyle aranır. 0 bellek tahsisi ve 20.0 sabit TPS.
            - **getChunkIfLoaded:** NMS paket motoru sadece hafızadaki yüklü chunkları kullanır, ana iş parçacığında disk okuma yapmaz.
            - **SubChunkCuller-1.3.0.jar:** Sürümle birebir eşleştirilmiş güncel dosya.
            - **Tüm İzinler & Bypass:** `subchunkculler.bypass` yetkisine sahip yetkililer tüm modüllerde filtreden muaf tutulur.
          files: target/SubChunkCuller-*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
