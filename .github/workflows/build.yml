name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "SubChunkCuller v1.0.6 (Zero-Lag & Native Entity Culling)"
          body: |
            ## 🚀 SubChunkCuller v1.0.6 (Zero-Lag Master Release)

            ### 🎯 Özellikler & Çözümler:
            - **OP Bypass Yetkisi Düzeltildi:** OP olan yöneticilerin filtreden atlanması engellendi. Artık adminler dahil herkes için yer altındaki varlıklar gizlenir.
            - **Paper Native `player.hideEntity` Entegrasyonu:** Paper'ın resmi gizleme API'sine geçildi. Vagonlar, sandık/huni vagonları, yaratıklar ve eşyalar yer altına girdiği anda istemciden tamamen silinir.
            - **%0.00 TPS Etkisi / Sıfır Lag:** 0 raycast, asenkron Netty filtreleme ve optimize edilmiş 64 blokluk takip yarıçapı ile sunucuyu asla yormaz.
            - **Tam Paket Koruması:** Hareket, can, hasar, iksir ve ses paketleri tamamen durdurulur.
            - **TAB Listesi & Ok Koruması:** `TAB` listesi ve atılan oklar bozulmaz.
          files: target/SubChunkCuller-1.0.0.jar
          token: ${{ secrets.GITHUB_TOKEN }}
