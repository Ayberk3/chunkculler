name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "SubChunkCuller v1.2.0 (10-Bug Mega Fix & Deep Audit Release)"
          body: |
            ## 🚀 SubChunkCuller v1.2.0 (10-Bug Mega Fix Release)

            ### 🔴 Kritik Bug Düzeltmeleri:
            - **BUG-1: `computeCutoffSection` mantık hatası düzeltildi.** `Math.min` → `Math.max`. Absolute cutoff artık doğru çalışıyor: yüzeyde Y=0 sınırı, yeraltında dinamik takip.
            - **BUG-2: Shared mutable chunk templates kaldırıldı.** Her paket için taze kopya oluşturularak çoklu oyuncuda veri bozulması riski sıfırlandı.
            - **BUG-3: ArrayDeque → ConcurrentLinkedQueue.** Thread-safe kuyruk + MAX_QUEUE_SIZE=5000 ile OutOfMemoryError riski engellendi.
            - **BUG-4: Her ses paketinde reflection taraması kaldırıldı.** Netty thread performansı dramatik arttı.

            ### 🟡 Orta Bug Düzeltmeleri:
            - **BUG-5: getNearbyEntities → getWorld().getEntities().** Sıfır bellek tahsisi, manuel mesafe kontrolü.
            - **BUG-6: `subchunkculler.bypass` izni artık tüm sistemlerde kontrol ediliyor.** Admin/OP bypass çalışır hale geldi.
            - **BUG-7: Entity tipi filtreleri (hide-players, hide-monsters, bypass-npcs, bypass-holograms) config.yml'e eklendi** ve EntityTrackerTask'ta aktif hale getirildi.
            - **BUG-8: NMS chunk yükleme kontrolü güçlendirildi.**

            ### 🟢 Düşük Risk Düzeltmeleri:
            - **BUG-9: Plugin kapatılırken tüm gizli entity'ler geri gösterilir.** Reload'da hayalet entity sorunu çözüldü.
            - **BUG-10: Boş legacy sınıflar temizlendi.**
          files: target/SubChunkCuller-*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
