name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: "SubChunkCuller v1.0.9 (Pure Vertical Culling & 100% Horizontal View Distance)"
          body: |
            ## 🚀 SubChunkCuller v1.0.9 (Pure Vertical Culling & Full Horizontal View)

            ### 🎯 Özellikler & Çözümler:
            - **Saf Dikey Gizleme (Sıfır Yatay Kesinti):** Oyuncunun bulunduğu Y seviyesi (örneğin Y = -5) ve yukarısı, oyuncunun görüş mesafesindeki (6-12 chunk) tüm yönlerde %100 eksiksiz ve açık kalır. Yatayda hiçbir blok veya chunk asla gizlenmez!
            - **Dinamik Görüş Mesafesi Yenileme:** Oyuncu seviye değiştirdiğinde görüş alanındaki (Client View Distance) tüm chunklar `ChunkResender` ile anında güncellenir.
            - **Yalnızca Derin Zemin Gizlenir:** Sadece oyuncunun altındaki derin katmanlar (örneğin `playerY - 32` altı) boşluğa dönüştürülür.
            - **Tam Varlık ve Vagon Gizleme:** Paper yerel `hideEntity` sistemiyle yerin altındaki hunili vagonlar ve yaratıklar tam gizlenir.
            - **%0.00 TPS Etkisi / Sıfır Lag:** 0 raycast, asenkron Netty filtreleme ile sunucu 20.0 TPS sabit çalışır.
          files: target/SubChunkCuller-1.0.0.jar
          token: ${{ secrets.GITHUB_TOKEN }}
