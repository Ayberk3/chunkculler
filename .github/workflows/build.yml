name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.4
          name: "SubChunkCuller v1.1.4 (Pure Lean Architecture & Zero-Overhead Release)"
          body: |
            ## 🚀 SubChunkCuller v1.1.4 (Pure Lean Release)

            ### 💎 Yapılan Temizlik & Optimizasyonlar:
            - **Gereksiz Özellikler & Çift Bellek Haritaları Kaldırıldı:** Eski entity takipçileri, gereksiz HashMap'ler ve çift kayıtlar tamamen silindi.
            - **Doğrudan Paper Native Motor:** Paper'ın kendi yerel `hideEntity` sistemiyle minimum bellek tüketimi ve sıfır GC yükü.
            - **Sıfır Bellek Tahsisi (Zero-Allocation Chunk Templates):** Boş ve Deepslate bölümleri önbellekten doğrudan atanır ($O(1)$).
            - **Yerin Altında Doğunca 0-ms Yükleme:** Doğuş anında tüm mağaralar anında yüklenir.
            - **SubChunkCuller-1.1.4.jar:** Sürümle birebir eşleştirilmiş güncel dosya.
            - **%0.00 TPS Etkisi / Sıfır Lag:** 0 raycast, asenkron Netty paket filtreleme.
          files: target/SubChunkCuller-*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
