name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "SubChunkCuller v1.0.3 (Crash Fix & Protocol Safe Release)"
          body: |
            ## 🚀 SubChunkCuller v1.0.3

            ### 🔧 Düzeltmeler:
            - **Crash & Disconnect Fix:** Netty chunk serileştirmesindeki biyom/palet bozulması düzeltildi. Girişteki çökme ve bağlantı kopmaları tamamen engellendi.
            - **Fake Floor (Deepslate) Güvenli Render:** Protokole uygun tekil biyom paleti ve global state ID ile sıfır çökme garantili sahte zemin.
            - **Tam Void & Entity Senkronizasyonu:** Silinen alandaki tüm moblar, oyuncular ve vagonlar gizlenir.
            - **Çoklu Binek ve Yolcu Senkronizasyonu:** Bot ve vagon yolcuları tam senkron.
            - **Patlama & TNT Koruması:** Yeraltı patlamaları filtrelenir.
          files: target/SubChunkCuller-1.0.0.jar
          token: ${{ secrets.GITHUB_TOKEN }}
