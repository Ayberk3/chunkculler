name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "SubChunkCuller v1.1.0 (Full Fake Deepslate Floor & Seamless Movement)"
          body: |
            ## 🚀 SubChunkCuller v1.1.0 (Fake Deepslate Floor Release)

            ### 💎 Yeni Özellikler & Çözümler:
            - **100% Kararlı ve Çökmesiz Fake Deepslate Floor:** Sınır kesim yüksekliğinin en alt katmanına kesintisiz, pürüzsüz sahte deepslate zemini yerleştirilir. Hileciler/Freecam aşağı baktığında sonsuz boşluk yerine doğal bir deepslate katmanı görür.
            - **Saf Dikey Gizleme (Sıfır Yatay Kesinti):** Oyuncunun bulunduğu Y seviyesi (örneğin Y = -5) ve yukarısı, oyuncunun görüş mesafesindeki (6-12 chunk) tüm yönlerde %100 eksiksiz ve açık kalır.
            - **ChunkResender NMS Motoru:** Yatay ve dikey hareketlerde chunklar anında istemciye basılır.
            - **Derinlemesine Binek & Yolcu Gizleme:** Vagon, bot ve binekler tüm yolcularıyla birlikte Paper resmi API'si ile gizlenir.
            - **%0.00 TPS Etkisi / Sıfır Lag:** 0 raycast, asenkron Netty filtreleme.
          files: target/SubChunkCuller-1.0.0.jar
          token: ${{ secrets.GITHUB_TOKEN }}
