name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.8
          name: "SubChunkCuller v1.0.8 (Ultimate Performance, Zero-Leak & Rock Solid)"
          body: |
            ## 🚀 SubChunkCuller v1.0.8 (Ultimate Final Release)

            ### 💎 Yapılan Kapsamlı Optimizasyonlar & Güvenlik Düzeltmeleri:
            - **ChunkResender NMS Motoru:** Yatay ve dikey hareketlerde chunkların anında istemciye basılması sağlandı, yüklenmeme sorunu çözüldü.
            - **Derinlemesine Binek & Yolcu Gizleme (Recursive Mounts):** Vagon, bot ve binekler tüm yolcularıyla birlikte tam senkronize gizlenir ve gösterilir.
            - **Paper Native `player.hideEntity` API:** Paper'ın resmi gizleme sistemiyle sıfır sızıntı garantisi.
            - **%0.00 TPS Etkisi / Sıfır Lag:** 0 raycast, asenkron Netty paket filtreleme ve 64 blokluk optimize edilmiş takip mesafesi ile sunucu performansına sıfır etki.
            - **Null-Safety & Thread Güvenliği:** Asenkron dünya erişimleri ve olası null-pointer riskleri %100 temizlendi.
            - **Patlama & TNT Koruması:** Yeraltı patlamaları filtrelenir.
          files: target/SubChunkCuller-1.0.0.jar
          token: ${{ secrets.GITHUB_TOKEN }}
