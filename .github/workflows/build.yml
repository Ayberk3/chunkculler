name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7
          name: "SubChunkCuller v1.0.7 (Chunk Resend Engine & Seamless Movement Fix)"
          body: |
            ## 🚀 SubChunkCuller v1.0.7 (Master Movement & Chunk Resend Release)

            ### 🎯 En Kritik Düzeltmeler:
            - **Yatay ve Dikey Hareketlerde Chunk Yüklenmeme Sorunu Çözüldü:** Paper 1.20+'da çalışmayan eski `world.refreshChunk` yerine, `ChunkResender` NMS paket motoru geliştirildi. Oyuncu hareket ettiğinde veya seviye değiştirdiğinde chunklar anında oyuncuya yeniden paketlenip gönderilir.
            - **Tam Varlık ve Vagon Gizleme:** Paper yerel `hideEntity` API'si ve PacketEvents filtreleriyle hunili vagonlar, yaratıklar ve varlıklar yerin altında asla görünmez.
            - **%0.00 TPS Etkisi / Sıfır Lag:** 0 raycast, asenkron Netty filtreleme ve optimize edilmiş 64 blokluk takip yarıçapı ile sunucuyu asla yormaz.
            - **Patlama & TNT Koruması:** Yeraltı patlama paketleri filtrelenir.
          files: target/SubChunkCuller-1.0.0.jar
          token: ${{ secrets.GITHUB_TOKEN }}
