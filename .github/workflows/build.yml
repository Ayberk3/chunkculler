name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "SubChunkCuller v1.0.4 (100% Airtight, Zero-Leak & Rock Solid)"
          body: |
            ## 🚀 SubChunkCuller v1.0.4 (Airtight Master Release)

            ### 🛡️ Kapsamlı Güvenlik, Performans ve Kararlılık İyileştirmeleri:
            - **Async Netty Thread Safety:** Paket filtreleme sırasında asenkron dünya/varlık erişimi kaldırıldı (`hideEntityId`), thread çakışmaları %100 önlendi.
            - **Cross-World Distance Fix:** Dünyalar arası ışınlanmalarda (Overworld -> Nether/End) oluşabilecek Bukkit mesafe hatası düzeltildi.
            - **Tam Paket Kapsamı (100% Anti-ESP):** `ENTITY_SOUND_EFFECT`, `HURT_ANIMATION`, `DAMAGE_EVENT`, `ENTITY_EFFECT`, `REMOVE_ENTITY_EFFECT` paketleri de filtreye eklendi; hileciler gizli yaratıkları can/hasar/iksir/ses paketleriyle bile tespit edemez.
            - **Crash & Disconnect Fix:** Netty chunk serileştirmesindeki biyom/palet yapısı standart protokolle optimize edildi.
            - **Patlama & TNT Koruması:** Yeraltı patlama paketleri filtrelenir.
            - **Fake Floor (Deepslate) Güvenli Render:** Kararlı tekil biyom paletiyle çökmesiz sahte zemin.
            - **TAB & Skin Koruması:** `TAB` listesi ve skinler bozulmaz.
          files: target/SubChunkCuller-1.0.0.jar
          token: ${{ secrets.GITHUB_TOKEN }}
