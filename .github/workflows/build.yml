name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.3
          name: "SubChunkCuller v1.1.3 (Zero-Allocation Engine & Ultimate Performance)"
          body: |
            ## 🚀 SubChunkCuller v1.1.3 (Zero-Allocation Performance Release)

            ### 💎 Ultra-Performans & Mimari İyileştirmeleri:
            - **Sıfır Bellek Tahsisi (Zero-Allocation Chunk Templates):** Boş ve Deepslate bölümleri istemci sürümüne göre önceden derlenip önbelleğe alınır ($O(1)$ işaretçi ataması). Netty iş parçacığında gereksiz GC (Garbage Collection) ve bellek tahsisi sıfıra indirildi.
            - **Dinamik & Mutlak Kesim Senkronizasyonu (`absolute-cutoff-y: 0`):** Yüzeydeyken kesinti Y=0'dan başlar, yeraltında ise dinamik olarak oyuncuyu takip eder.
            - **Yerin Altında Doğunca 0-ms Yükleme:** `PlayerSpawnLocationEvent` ve canlı konum takibi ile yer altında doğar doğmaz tüm mağaralar anında yüklenir.
            - **SubChunkCuller-1.1.3.jar:** Jar ismi sürümle birebir eşleştirildi.
            - **%0.00 TPS Etkisi / Sıfır Lag:** 0 raycast, asenkron Netty filtreleme ile sunucu 20.0 TPS sabit çalışır.
          files: target/SubChunkCuller-*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
