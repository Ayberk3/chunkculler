name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "SubChunkCuller v1.0.2 (Ultimate Stable & 100% Leak-Free)"
          body: |
            ## 🚀 SubChunkCuller v1.0.2 (Ultimate Stable Release)

            ### 🔥 Tüm Düzeltmeler ve Özellikler:
            - **Fake Floor (Deepslate Katmanı):** 64 biyom paleti ve global block state ID desteğiyle sahte zemin pürüzsüzce render edilir.
            - **Tam Void & Entity Senkronizasyonu:** Silinen mağara ve chunk bölümlerindeki tüm moblar (Zombi, İskelet, Creeper, Örümcek), oyuncular ve vagonlar boşlukta görünmez.
            - **Çoklu Binek ve Yolcu Senkronizasyonu:** Bot ve vagonlara binen varlıklar araçlarıyla birlikte senkron gizlenir/gösterilir.
            - **Şehir NPC & Hologram Koruması:** `FancyNpcs` ve `DecentHolograms` varlıkları yer altında olsa dahi korunur.
            - **Patlama & TNT Koruması:** Derindeki patlama paketleri (`EXPLOSION`) filtrelenerek TNT radar sızıntıları engellendi.
            - **Sıfır Raycast / Sıfır Lag:** Blok çakışma hesabı yapmaz, TPS etkisi %0.00'dır.
            - **TAB & Skin Koruması:** `TAB` listesi ve skinler bozulmaz.
          files: target/SubChunkCuller-1.0.0.jar
          token: ${{ secrets.GITHUB_TOKEN }}
