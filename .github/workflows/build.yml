name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.2
          name: "SubChunkCuller v1.1.2 (Absolute Cutoff & Instant Join Release)"
          body: |
            ## 🚀 SubChunkCuller v1.1.2

            ### 🎯 En Kritik Düzeltmeler:
            - **Absolute Cutoff (absolute-cutoff-y) Düzeltildi:** `absolute-cutoff-y: 0` ayarı tamamen aktif edildi. Oyuncu yüzeydeyken (Y=80) kesinti bu seviyeden (Y=0) başlar. Oyuncu yerin altına indiğinde ise göreceli `sub-chunks-below` dinamik olarak devreye girer.
            - **Yerin Altında Doğunca Anında Yükleme:** `PlayerSpawnLocationEvent` ve canlı konum senkronizasyonu ile yer altında doğar doğmaz tüm mağaralar 0 gecikmeyle yüklenir.
            - **SubChunkCuller-1.1.2.jar:** Jar ismi sürümle birebir eşitlendi.
            - **100% Kararlı Fake Deepslate Zemin:** Kesinti sınırının en altında pürüzsüz Deepslate tabakası oluşturulur.
            - **Saf Dikey Gizleme (Sıfır Yatay Kesinti):** Oyuncunun bulunduğu Y seviyesinde yatay görüş (6-12 chunk) %100 açık kalır.
            - **%0.00 TPS Etkisi / Sıfır Lag:** 0 raycast, asenkron Netty paket filtreleme.
          files: target/SubChunkCuller-*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
