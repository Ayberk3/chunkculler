name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.1
          name: "SubChunkCuller v1.4.1 (Bulletproof Compatibility Release)"
          body: |
            ## 🚀 SubChunkCuller v1.4.1 (Bulletproof Compatibility)

            ### 👑 Yenilikler & Muhtemel Hata (Edge Case) Çözümleri:
            - **👻 Vanish Plugin Uyumluluğu:** Tab listesini koruyan sistem, artık Essentials, PremiumVanish vb. eklentilerle %100 uyumlu! Sistemimiz sadece *kendi gizlediği* oyuncuların Tab listesinde kalmasını sağlar. Adminler vanish kullandığında kusursuz çalışır.
            - **👥 Kapsamlı Paket Engelleme:** `SPAWN_ENTITY` yanına 1.18.x ve 1.19.x sürümleri için `SPAWN_PLAYER`, `SPAWN_ENTITY_LIVING`, `SPAWN_ENTITY_EXPERIENCE_ORB`, `SPAWN_ENTITY_PAINTING` gibi tüm olasılıklar eklendi.
            - **📋 PLAYER_INFO_UPDATE Desteği:** 1.19.3+ sürümlerde tab listesi güncellemelerinde `UPDATE_LISTED` aksiyonu kullanılarak oyuncuların kaybolma riski tamamen sıfırlandı.
            - **🪂 Yüksekten Düşerken Boşlukta Kalma (Void Bug) Çözüldü:**
              - Debounce gecikmesi Y-ekseni hareketlerinde sıfırlandı.
              - `ChunkRefreshListener` içine **3D Uzaklık Sıralayıcı** eklendi; oyuncunun içinde bulunduğu merkez chunk 1. tickte öncelikli olarak gönderilir.
            - **👥 Tab Listeden Silinme Sorunu Çözüldü:**
              - Paper'ın native `hideEntity` metodunun oyuncuyu Tab listesinden kaldırması engellendi.
              - `EntityPacketListener` içerisinde `PLAYER_INFO_REMOVE` ve `PLAYER_INFO` paketleri yakalanarak yerin altındaki oyuncuların Tab listesinde kalması sağlandı!
            - **⚡ Sıfır TPS Kaybı & Kesintisiz Deneyim:**
              - Paket bazlı akıllı filtreleme ile sıfır işlemci yükü ve 20.0 TPS garantisi.
          files: target/SubChunkCuller-*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
