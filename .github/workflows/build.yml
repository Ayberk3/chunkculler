name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.1
          name: "SubChunkCuller v1.1.1 (Instant Underground Join & Zero-Lag Fix)"
          body: |
            ## 🚀 SubChunkCuller v1.1.1 (Instant Underground Join Release)

            ### 🎯 En Kritik Düzeltmeler:
            - **Yerin Altında Doğunca 30 Saniye Takılı Kalma/Yüklenmeme Sorunu Çözüldü:** `PlayerSpawnLocationEvent` ve canlı `getLocation()` senkronizasyonu eklendi. Oyuncu yer altında doğduğu ilk saniyeden itibaren etrafındaki tüm mağaralar ve zemin sıfır gecikmeyle yüklenir.
            - **SubChunkCuller-1.1.1.jar:** Jar ismi sürümle birebir eşleştirildi.
            - **100% Kararlı Fake Deepslate Zemin:** Kesinti sınırının en altında pürüzsüz Deepslate tabakası oluşturulur.
            - **Saf Dikey Gizleme (Sıfır Yatay Kesinti):** Oyuncunun bulunduğu Y seviyesinde yatay görüş (6-12 chunk) %100 açık kalır.
            - **%0.00 TPS Etkisi / Sıfır Lag:** 0 raycast, asenkron Netty paket filtreleme.
          files: target/SubChunkCuller-*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
