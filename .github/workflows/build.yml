name: Build & Release Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubChunkCuller-jar
          path: target/SubChunkCuller-*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: "SubChunkCuller v1.0.5 (Native Paper Entity Culling & OP Bypass Fix)"
          body: |
            ## 🚀 SubChunkCuller v1.0.5

            ### 🎯 En Kritik Düzeltmeler:
            - **OP Bypass Yetki Hatası Çözüldü:** Sunucuda OP olan adminlerin `subchunkculler.bypass` yetkisi yüzünden entity taramasından otomatik atlanması engellendi. Artık OP olsan da olmasan da yer altındaki TÜM varlıklar gizlenir.
            - **Paper Native `player.hideEntity` Entegrasyonu:** Paper'ın yerel entity gizleme motoruna geçildi. Yerdeki vagonlar, sandıklı/hunili vagonlar, zombiler, iskeletler ve creeperlar sıfır gecikmeyle istemciden tamamen yok edilir.
            - **128 Blok Geniş Tarama Alanı:** Görüş alanındaki tüm varlıklar 2 ticklik (0.1s) ultra hızlı aralıkla taranır.
          files: target/SubChunkCuller-1.0.0.jar
          token: ${{ secrets.GITHUB_TOKEN }}
